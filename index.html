<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>AdaptiveInteractive</title>

  <meta
    name="description"
    content="AdaptiveInteractive creates thoughtful, adaptive digital experiences."
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="site-card" aria-labelledby="site-title">
    <div class="theme-control">
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
        Dark mode
      </button>
    </div>

    <section class="identity">
      <p class="eyebrow">AdaptiveInteractive.com</p>

      <h1 id="site-title">AdaptiveInteractive</h1>

      <p class="tagline">
        Adaptive digital experiences for people, systems, and ideas in motion.
      </p>
    </section>

    <section class="signals" aria-label="Focus areas">
      <span>Design</span>
      <span>Engineering</span>
      <span>Automation</span>
      <span>Interfaces</span>
      <span>CI/CD</span>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme) {
      root.dataset.theme = savedTheme;
    }

    function getCurrentTheme() {
      if (root.dataset.theme === "dark") return "dark";
      if (root.dataset.theme === "light") return "light";

      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function updateButtonLabel() {
      const currentTheme = getCurrentTheme();
      toggle.textContent = currentTheme === "dark" ? "Light mode" : "Dark mode";
    }

    toggle.addEventListener("click", () => {
      const currentTheme = getCurrentTheme();
      const nextTheme = currentTheme === "dark" ? "light" : "dark";

      root.dataset.theme = nextTheme;
      localStorage.setItem("theme", nextTheme);
      updateButtonLabel();
    });

    updateButtonLabel();
  </script>
</body>
</html>
