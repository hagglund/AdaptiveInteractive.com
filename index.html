<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Adaptive Interactive</title>

  <meta
    name="description"
    content="AdaptiveInteractive creates thoughtful, adaptive digital experiences."
  />
  
  <meta property="og:title" content="Adaptive Interactive" />
  <meta
    property="og:description"
    content="Adaptive digital experiences for people, systems, and ideas in motion."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://adaptiveinteractive.com/" />

  <meta name="theme-color" content="#2563eb" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" /> -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="site-card" aria-labelledby="site-title">
    <div class="theme-control">
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
        Dark mode
      </button>
    </div>

    <section class="identity">
      <h1 id="site-title">Adaptive Interactive</h1>

      <p class="tagline">
        Aeronautics, Space, Military, Intelligence, Policy
      </p>
    </section>

    <section class="signals" aria-label="Focus areas">
      <span>System Design</span>
      <span>Automation Engineering</span>
      <span>Control Interfaces</span>
      <span>AI/SuperIntelligence</span>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const toggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme) {
      root.dataset.theme = savedTheme;
    }

    function getCurrentTheme() {
      if (root.dataset.theme === "dark") return "dark";
      if (root.dataset.theme === "light") return "light";

      return window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function updateButtonLabel() {
      const currentTheme = getCurrentTheme();
      toggle.textContent = currentTheme === "dark" ? "Light mode" : "Dark mode";
    }

    toggle.addEventListener("click", () => {
      const currentTheme = getCurrentTheme();
      const nextTheme = currentTheme === "dark" ? "light" : "dark";

      root.dataset.theme = nextTheme;
      localStorage.setItem("theme", nextTheme);
      updateButtonLabel();
    });

    updateButtonLabel();
  </script>
</body>
</html>
